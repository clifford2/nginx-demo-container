#
# Kind cluster config file to set extraPortMappings.
# Create cluster with:
#   kind create cluster --config kind-config.yaml
# See service-kind.yaml for example service that uses this.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    listenAddress: "0.0.0.0"
    protocol: "tcp"
