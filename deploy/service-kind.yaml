#
# NodePort service for Kind cluster, using cluster extraPortMappings to export service to the nodePort below.
# See kind-config.yaml for corresponding cluster configuration.

apiVersion: "v1"
kind: "Service"
metadata:
  name: "nginx-demo"
  labels:
    app.kubernetes.io/name: "nginx-demo"
    app.kubernetes.io/instance: "nginx-demo"
    app.kubernetes.io/component: "website"
    app: "nginx-demo"
spec:
  type: "NodePort"
  ports:
    - name: "http"
      port: 8080
      protocol: "TCP"
      targetPort: "http"
      nodePort: 30080
  selector:
    app.kubernetes.io/name: "nginx-demo"
  sessionAffinity: "None"
